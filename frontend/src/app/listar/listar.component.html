<div class="container mt-4 bg-dark bg-opacity-75 rounded-4 p-4">

  <!-- Buscador -->
  <form (ngSubmit)="buscar()">
    <div class="input-group mb-4">
      <input [(ngModel)]="valorBusqueda" name="valorBusqueda" class="form-control" placeholder="Buscar..." />
      <button class="btn btn-primary" type="submit">Buscar</button>
    </div>
  </form>

  <!-- Mensajes -->
  <div *ngIf="mensajeInformativo" class="alert alert-warning text-center">
    {{ mensajeInformativo }}
  </div>
  <div *ngIf="mensajeError" class="alert alert-danger text-center">
    {{ mensajeError }}
  </div>

  <!-- Tarjetas estilo "Inicio" -->
  <div class="row">
    <div class="col-md-4 mb-4" *ngFor="let libro of data">
      <div class="card h-100 border-0 bg-dark text-white text-center rounded shadow">
        <img *ngIf="libro.portada" [src]="rutaImagen + libro.portada" alt="Portada" class="img-fluid p-3 img-libro">
        <div class="card-body">
          <h5 class="card-title fw-bold">{{ libro.titulo }}</h5>
          <p class="mb-1">{{ libro.autor }}</p>
          <div class="bg-warning text-primary fw-bold rounded py-1 mb-2 precio-grande">
            S/ {{ libro.precio }}
          </div>
          <div class="d-flex gap-2">
            <button class="boton-azul btn-sm" (click)="agregarAlCarrito(libro)">🛒 Agregar al carrito</button>
            <button *ngIf="esAdmin" class="btn btn-danger btn-sm" (click)="Delete(libro)">🗑️ Eliminar</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
